name: Secret Scan (2MS)

on: [pull_request]

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create report directory
        run: mkdir -p artifacts

      - name: Run 2MS
        run: |
          docker run --rm \
            -v "$PWD":/repo \
            checkmarx/2ms \
            git /repo \
            --report-path /repo/artifacts/2ms.yaml \
            --ignore-on-exit results

      - name: Display 2MS report
        run: |
          echo "===== 2MS SECURITY REPORT ====="
          cat artifacts/2ms.yaml

      - name: Upload 2MS Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2ms-readable-report
          path: artifacts/2ms.yaml
          if-no-files-found: error