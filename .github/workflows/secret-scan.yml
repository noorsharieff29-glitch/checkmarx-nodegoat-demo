# 2MS Secret Scan — Readable PDF Report
name: Secret Scan (2ms)

on: [push]

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create artifacts directory
        run: |
          mkdir -p artifacts

      - name: Run 2MS
        run: |
          docker run --rm \
            -v "$PWD":/repo \
            checkmarx/2ms \
            git /repo \
            --stdout-format sarif \
            --report-path /repo/artifacts/2ms.sarif \
            --ignore-on-exit results

      - name: Upload SARIF to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: artifacts/2ms.sarif

      - name: Show 2MS results
        if: always()
        run: |
          echo "======================================"
          echo "2MS SARIF REPORT"
          echo "======================================"

          ls -lh artifacts/

          echo ""
          echo "Number of findings:"
          jq '.runs[].results | length' artifacts/2ms.sarif

      - name: Generate readable HTML report
        if: always()
        run: |
          python3 <<'PY'
          import json
          import html

          with open("artifacts/2ms.sarif", "r") as f:
              sarif = json.load(f)

          findings = []

          for run in sarif.get("runs", []):
              rules = {
                  r.get("id"): r
                  for r in run.get("tool", {})
                           .get("driver", {})
                           .get("rules", [])
              }

              for result in run.get("results", []):

                  rule_id = result.get("ruleId", "")
                  rule = rules.get(rule_id, {})

                  message = result.get("message", {}).get("text", "")

                  level = result.get("level", "warning")

                  for location in result.get("locations", []):

                      physical = location.get(
                          "physicalLocation", {}
                      )

                      artifact = physical.get(
                          "artifactLocation", {}
                      )

                      file_path = artifact.get(
                          "uri", "Unknown"
                      )

                      region = physical.get(
                          "region", {}
                      )

                      line = region.get(
                          "startLine", "N/A"
                      )

                      findings.append({
                          "rule": rule_id,
                          "name": rule.get(
                              "name",
                              rule_id
                          ),
                          "severity": level,
                          "message": message,
                          "file": file_path,
                          "line": line
                      })

          with open(
              "artifacts/2ms-security-report.html",
              "w"
          ) as f:

              f.write("""
              <!DOCTYPE html>
              <html>

              <head>

              <meta charset="UTF-8">

              <title>2MS Secret Scan Report</title>

              <style>

              body {
                  font-family: Arial, sans-serif;
                  margin: 40px;
                  color: #222;
              }

              h1 {
                  border-bottom: 2px solid #333;
                  padding-bottom: 10px;
              }

              .summary {
                  background: #f4f4f4;
                  padding: 20px;
                  margin: 20px 0;
                  border-radius: 6px;
              }

              .finding {
                  border: 1px solid #ccc;
                  border-radius: 6px;
                  padding: 20px;
                  margin: 20px 0;
                  page-break-inside: avoid;
              }

              .finding-title {
                  font-size: 18px;
                  font-weight: bold;
                  margin-bottom: 12px;
              }

              table {
                  width: 100%;
                  border-collapse: collapse;
              }

              td {
                  padding: 8px;
                  border-bottom: 1px solid #ddd;
              }

              .label {
                  font-weight: bold;
                  width: 130px;
              }

              .severity {
                  font-weight: bold;
              }

              .no-findings {
                  padding: 20px;
                  background: #f4f4f4;
                  border-radius: 6px;
              }

              </style>

              </head>

              <body>

              <h1>2MS Secret Scan Report</h1>

              <div class="summary">

              <table>

              <tr>
                <td class="label">Repository</td>
                <td>${{ github.repository }}</td>
              </tr>

              <tr>
                <td class="label">Branch</td>
                <td>${{ github.ref_name }}</td>
              </tr>

              <tr>
                <td class="label">Commit</td>
                <td>${{ github.sha }}</td>
              </tr>

              <tr>
                <td class="label">Total Findings</td>
                <td>""" + str(len(findings)) + """</td>
              </tr>

              </table>

              </div>
              """)

              if not findings:

                  f.write("""
                  <div class="no-findings">

                  <h2>No Secrets Detected</h2>

                  <p>
                  2MS did not identify any secret
                  exposure in the scanned repository.
                  </p>

                  </div>
                  """)

              else:

                  f.write(
                      "<h2>Security Findings</h2>"
                  )

                  for index, finding in enumerate(
                      findings, 1
                  ):

                      f.write(
                          "<div class='finding'>"
                      )

                      f.write(
                          "<div class='finding-title'>"
                          "Finding "
                          + str(index)
                          + ": "
                          + html.escape(
                              finding["name"]
                          )
                          + "</div>"
                      )

                      f.write("<table>")

                      f.write(
                          "<tr><td class='label'>"
                          "Rule</td><td>"
                          + html.escape(
                              finding["rule"]
                          )
                          + "</td></tr>"
                      )

                      f.write(
                          "<tr><td class='label'>"
                          "Severity</td><td class='severity'>"
                          + html.escape(
                              finding["severity"]
                          )
                          + "</td></tr>"
                      )

                      f.write(
                          "<tr><td class='label'>"
                          "File</td><td>"
                          + html.escape(
                              finding["file"]
                          )
                          + "</td></tr>"
                      )

                      f.write(
                          "<tr><td class='label'>"
                          "Line</td><td>"
                          + str(
                              finding["line"]
                          )
                          + "</td></tr>"
                      )

                      f.write(
                          "<tr><td class='label'>"
                          "Description</td><td>"
                          + html.escape(
                              finding["message"]
                          )
                          + "</td></tr>"
                      )

                      f.write("</table>")
                      f.write("</div>")

              f.write("""
              </body>
              </html>
              """)

          print(
              f"2MS findings found: {len(findings)}"
          )
          PY

      - name: Install PDF converter
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf

      - name: Convert HTML to PDF
        if: always()
        run: |
          wkhtmltopdf \
            --enable-local-file-access \
            artifacts/2ms-security-report.html \
            artifacts/2ms-security-report.pdf

      - name: Verify PDF
        if: always()
        run: |
          echo "======================================"
          echo "Generated files"
          echo "======================================"

          ls -lh artifacts/

          if [ -f "artifacts/2ms-security-report.pdf" ]; then
            echo "SUCCESS: 2MS PDF generated."
          else
            echo "ERROR: 2MS PDF was not generated."
            exit 1
          fi

      - name: Upload 2MS PDF Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2ms-security-report
          path: artifacts/2ms-security-report.pdf
          retention-days: 30