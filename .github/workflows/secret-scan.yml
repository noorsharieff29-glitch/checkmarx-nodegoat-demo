# 2MS Secret Scan — PDF Artifact

name: Secret Scan (2MS)

on: [push]

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # IMPORTANT: Create the directory before Docker writes into it
      - name: Create artifacts directory
        run: |
          mkdir -p artifacts
          chmod 777 artifacts

      - name: Run 2MS
        run: |
          docker run --rm \
            -v "$PWD":/repo \
            checkmarx/2ms \
            git /repo \
            --stdout-format sarif \
            --report-path /repo/artifacts/2ms.sarif \
            --report-path /repo/artifacts/2ms.json \
            --ignore-on-exit results

      - name: Verify 2MS output
        if: always()
        run: |
          echo "======================================"
          echo "2MS OUTPUT FILES"
          echo "======================================"

          ls -lah artifacts/

          echo ""
          echo "SARIF:"
          if [ -f artifacts/2ms.sarif ]; then
            echo "2ms.sarif FOUND"
            ls -lh artifacts/2ms.sarif
          else
            echo "2ms.sarif NOT FOUND"
          fi

          echo ""
          echo "JSON:"
          if [ -f artifacts/2ms.json ]; then
            echo "2ms.json FOUND"
            ls -lh artifacts/2ms.json
          else
            echo "2ms.json NOT FOUND"
          fi

      - name: Upload SARIF to GitHub
        if: always() && hashFiles('artifacts/2ms.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: artifacts/2ms.sarif

      - name: Install ReportLab
        if: always()
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install reportlab

      - name: Generate readable PDF
        if: always()
        run: |
          python3 <<'PY'
          import json
          import os
          from reportlab.lib import colors
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.styles import getSampleStyleSheet
          from reportlab.lib.units import mm
          from reportlab.platypus import (
              SimpleDocTemplate,
              Paragraph,
              Spacer,
              Table,
              TableStyle
          )

          json_file = "artifacts/2ms.json"
          pdf_file = "artifacts/2ms-security-report.pdf"

          if not os.path.exists(json_file):
              print("2MS JSON report was not generated.")
              print("Creating a PDF explaining that no report was available.")

              data = {
                  "results": []
              }

          else:
              with open(json_file, "r", encoding="utf-8") as f:
                  data = json.load(f)

          findings = []

          # 2MS JSON structure may contain results under different
          # nesting depending on the version, so inspect common locations.

          if isinstance(data, dict):

              if isinstance(data.get("results"), list):
                  findings = data["results"]

              elif isinstance(data.get("findings"), list):
                  findings = data["findings"]

              elif isinstance(data.get("runs"), list):
                  for run in data["runs"]:
                      if isinstance(run, dict):
                          results = run.get("results", [])
                          if isinstance(results, list):
                              findings.extend(results)

          print("Total findings:", len(findings))

          styles = getSampleStyleSheet()

          title = styles["Title"]
          heading = styles["Heading2"]
          body = styles["BodyText"]

          doc = SimpleDocTemplate(
              pdf_file,
              pagesize=A4,
              rightMargin=18 * mm,
              leftMargin=18 * mm,
              topMargin=18 * mm,
              bottomMargin=18 * mm
          )

          story = []

          story.append(
              Paragraph(
                  "2MS Secret Scan Report",
                  title
              )
          )

          story.append(Spacer(1, 10))

          summary = [
              ["Repository", "${{ github.repository }}"],
              ["Branch", "${{ github.ref_name }}"],
              ["Commit", "${{ github.sha }}"],
              ["Total Findings", str(len(findings))]
          ]

          table = Table(
              summary,
              colWidths=[40 * mm, 130 * mm]
          )

          table.setStyle(
              TableStyle([
                  ("GRID", (0, 0), (-1, -1), 0.5, colors.grey),
                  ("BACKGROUND", (0, 0), (0, -1), colors.lightgrey),
                  ("FONTNAME", (0, 0), (0, -1), "Helvetica-Bold"),
                  ("VALIGN", (0, 0), (-1, -1), "TOP"),
                  ("PADDING", (0, 0), (-1, -1), 6),
              ])
          )

          story.append(table)
          story.append(Spacer(1, 20))

          story.append(
              Paragraph(
                  "Security Findings",
                  heading
              )
          )

          story.append(Spacer(1, 10))

          if not findings:

              story.append(
                  Paragraph(
                      "No secret findings were returned by 2MS.",
                      body
                  )
              )

          else:

              for number, finding in enumerate(findings, 1):

                  rule = (
                      finding.get("ruleId")
                      or finding.get("rule")
                      or finding.get("RuleID")
                      or "Unknown"
                  )

                  description = (
                      finding.get("message")
                      or finding.get("description")
                      or finding.get("Description")
                      or "No description available"
                  )

                  severity = (
                      finding.get("severity")
                      or finding.get("level")
                      or finding.get("Severity")
                      or "Unknown"
                  )

                  file_path = "Unknown"
                  line = "N/A"

                  locations = finding.get(
                      "locations",
                      []
                  )

                  if locations:

                      location = locations[0]

                      physical = location.get(
                          "physicalLocation",
                          {}
                      )

                      artifact = physical.get(
                          "artifactLocation",
                          {}
                      )

                      region = physical.get(
                          "region",
                          {}
                      )

                      file_path = (
                          artifact.get(
                              "uri",
                              "Unknown"
                          )
                      )

                      line = (
                          region.get(
                              "startLine",
                              "N/A"
                          )
                      )

                  story.append(
                      Paragraph(
                          f"Finding {number}: {rule}",
                          heading
                      )
                  )

                  details = [
                      ["Rule", str(rule)],
                      ["Severity", str(severity)],
                      ["File", str(file_path)],
                      ["Line", str(line)],
                      ["Description", str(description)]
                  ]

                  finding_table = Table(
                      details,
                      colWidths=[35 * mm, 135 * mm]
                  )

                  finding_table.setStyle(
                      TableStyle([
                          ("GRID", (0, 0), (-1, -1), 0.5, colors.grey),
                          ("BACKGROUND", (0, 0), (0, -1), colors.lightgrey),
                          ("FONTNAME", (0, 0), (0, -1), "Helvetica-Bold"),
                          ("VALIGN", (0, 0), (-1, -1), "TOP"),
                          ("PADDING", (0, 0), (-1, -1), 6),
                      ])
                  )

                  story.append(finding_table)
                  story.append(Spacer(1, 15))

          doc.build(story)

          print("======================================")
          print("PDF CREATED")
          print("======================================")
          print(pdf_file)
          print(
              "Size:",
              os.path.getsize(pdf_file),
              "bytes"
          )

          PY

      - name: Verify final files
        if: always()
        run: |
          echo "======================================"
          echo "FINAL ARTIFACT DIRECTORY"
          echo "======================================"

          find artifacts -maxdepth 1 -type f -exec ls -lh {} \;

          echo ""
          echo "PDF CHECK:"

          if [ -f artifacts/2ms-security-report.pdf ]; then
            echo "SUCCESS - PDF exists"
          else
            echo "ERROR - PDF does not exist"
            exit 1
          fi

      - name: Upload 2MS PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2ms-security-report
          path: artifacts/2ms-security-report.pdf
          if-no-files-found: error
          retention-days: 30