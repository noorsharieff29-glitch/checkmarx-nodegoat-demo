name: Secret Scan (2MS)

on: [push]

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create reports directory
        run: |
          mkdir -p artifacts

      - name: Run 2MS
        run: |
          docker run --rm \
            -v "$PWD":/repo \
            checkmarx/2ms \
            git /repo \
            --stdout-format json \
            --report-path /repo/artifacts/2ms.json \
            --ignore-on-exit results

      - name: Check 2MS result
        if: always()
        run: |
          echo "================================"
          echo "2MS RESULT"
          echo "================================"

          ls -lah artifacts/

          if [ -f artifacts/2ms.json ]; then
            echo "2MS JSON report generated."
          else
            echo "ERROR: 2MS report not generated."
            exit 1
          fi

      - name: Create readable HTML report
        if: always()
        run: |

          python3 <<'PY'

          import json
          import html

          input_file = "artifacts/2ms.json"
          output_file = "artifacts/2ms-report.html"

          with open(input_file, "r", encoding="utf-8") as f:
              data = json.load(f)

          findings = []

          # Handle common 2MS JSON structures

          if isinstance(data, list):
              findings = data

          elif isinstance(data, dict):

              for key in [
                  "results",
                  "findings",
                  "Results",
                  "Findings"
              ]:

                  if isinstance(data.get(key), list):
                      findings = data[key]
                      break

          print("Total findings:", len(findings))

          with open(
              output_file,
              "w",
              encoding="utf-8"
          ) as f:

              f.write("""
              <!DOCTYPE html>

              <html>

              <head>

              <meta charset="UTF-8">

              <title>2MS Secret Scan Report</title>

              <style>

              body {
                  font-family: Arial, sans-serif;
                  margin: 40px;
                  background: #f7f7f7;
                  color: #222;
              }

              .container {
                  max-width: 1100px;
                  margin: auto;
                  background: white;
                  padding: 30px;
              }

              h1 {
                  margin-bottom: 5px;
              }

              .subtitle {
                  color: #666;
                  margin-bottom: 30px;
              }

              .summary {
                  padding: 20px;
                  background: #f1f1f1;
                  margin-bottom: 30px;
                  border-radius: 6px;
              }

              .count {
                  font-size: 28px;
                  font-weight: bold;
              }

              .finding {
                  border: 1px solid #ccc;
                  border-radius: 6px;
                  padding: 20px;
                  margin-bottom: 20px;
              }

              .finding h2 {
                  margin-top: 0;
              }

              table {
                  width: 100%;
                  border-collapse: collapse;
              }

              td {
                  padding: 10px;
                  border-bottom: 1px solid #ddd;
                  vertical-align: top;
              }

              td:first-child {
                  width: 150px;
                  font-weight: bold;
              }

              .none {
                  padding: 20px;
                  background: #eee;
                  border-radius: 6px;
              }

              </style>

              </head>

              <body>

              <div class="container">

              <h1>2MS Secret Scan Report</h1>

              <div class="subtitle">
              Checkmarx 2MS – Secret Detection
              </div>

              <div class="summary">

              <strong>Repository:</strong>
              """ + html.escape(
                  "${{ github.repository }}"
              ) + """<br><br>

              <strong>Branch:</strong>
              """ + html.escape(
                  "${{ github.ref_name }}"
              ) + """<br><br>

              <strong>Commit:</strong>
              """ + html.escape(
                  "${{ github.sha }}"
              ) + """<br><br>

              <strong>Total Findings:</strong>

              <div class="count">
              """ + str(len(findings)) + """
              </div>

              </div>

              <h2>Security Findings</h2>
              """)

              if not findings:

                  f.write("""
                  <div class="none">

                  <h3>No findings reported by 2MS</h3>

                  <p>
                  2MS did not return any secret findings
                  for this scan.
                  </p>

                  </div>
                  """)

              else:

                  for number, finding in enumerate(
                      findings,
                      1
                  ):

                      if not isinstance(
                          finding,
                          dict
                      ):
                          finding = {
                              "Finding": str(finding)
                          }

                      rule = (
                          finding.get("ruleId")
                          or finding.get("rule")
                          or finding.get("Rule")
                          or "Secret detected"
                      )

                      message = (
                          finding.get("message")
                          or finding.get("description")
                          or finding.get("Message")
                          or "Potential secret detected."
                      )

                      severity = (
                          finding.get("severity")
                          or finding.get("level")
                          or finding.get("Severity")
                          or "Unknown"
                      )

                      file_path = (
                          finding.get("file")
                          or finding.get("path")
                          or finding.get("File")
                          or "Unknown"
                      )

                      line = (
                          finding.get("line")
                          or finding.get("Line")
                          or "N/A"
                      )

                      f.write(
                          "<div class='finding'>"
                      )

                      f.write(
                          "<h2>Finding "
                          + str(number)
                          + "</h2>"
                      )

                      f.write("<table>")

                      rows = [
                          ("Secret / Rule", rule),
                          ("Severity", severity),
                          ("File", file_path),
                          ("Line", line),
                          ("Description", message)
                      ]

                      for label, value in rows:

                          f.write(
                              "<tr>"
                              "<td>"
                              + html.escape(
                                  str(label)
                              )
                              + "</td>"
                              "<td>"
                              + html.escape(
                                  str(value)
                              )
                              + "</td>"
                              "</tr>"
                          )

                      f.write(
                          "</table>"
                      )

                      f.write(
                          "</div>"
                      )

              f.write("""
              </div>

              </body>

              </html>
              """)

          print(
              "HTML report created:",
              output_file
          )

          PY

      - name: Upload readable 2MS report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2ms-security-report
          path: artifacts/2ms-report.html
          if-no-files-found: error
          retention-days: 30