name: Secret Scan (2ms)

on: [pull_request]

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Run 2MS
        run: |
          docker run --rm \
            -v "$PWD":/repo \
            checkmarx/2ms \
            git /repo \
            --report-path /repo/artifacts/2ms.yaml \
            --report-path /repo/artifacts/2ms.json \
            --report-path /repo/artifacts/2ms.sarif \
            --ignore-on-exit results

      - name: Verify reports were created
        run: |
          echo "===== ARTIFACT DIRECTORY ====="
          ls -lah artifacts/
          echo "===== YAML REPORT ====="
          cat artifacts/2ms.yaml

      - name: Upload 2MS reports
        uses: actions/upload-artifact@v4
        with:
          name: 2ms-reports
          path: artifacts/
          if-no-files-found: error

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: artifacts/2ms.sarif