# 2MS Secret Scan — PDF Artifact


name: Secret Scan (2MS)

on: [push]

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create artifacts directory
        run: |
          mkdir -p artifacts

      - name: Run 2MS
        run: |
          docker run --rm \
            -v "$PWD":/repo \
            checkmarx/2ms \
            git /repo \
            --stdout-format sarif \
            --report-path /repo/artifacts/2ms.sarif \
            --ignore-on-exit results

      - name: Check 2MS SARIF
        if: always()
        run: |
          echo "======================================"
          echo "2MS OUTPUT"
          echo "======================================"

          ls -lah artifacts/

          if [ ! -f artifacts/2ms.sarif ]; then
            echo "ERROR: 2MS SARIF file was not generated."
            exit 1
          fi

          echo ""
          echo "2MS findings:"
          jq '[.runs[].results[]] | length' artifacts/2ms.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: artifacts/2ms.sarif

      - name: Install ReportLab
        run: |
          python3 -m pip install reportlab

      - name: Generate PDF report
        if: always()
        run: |
          python3 <<'PY'
          import json
          import os
          from reportlab.lib.pagesizes import A4
          from reportlab.platypus import (
              SimpleDocTemplate,
              Paragraph,
              Spacer,
              Table,
              TableStyle,
              PageBreak
          )
          from reportlab.lib import colors
          from reportlab.lib.styles import getSampleStyleSheet
          from reportlab.lib.enums import TA_CENTER

          sarif_file = "artifacts/2ms.sarif"
          pdf_file = "artifacts/2ms-security-report.pdf"

          with open(sarif_file, "r", encoding="utf-8") as f:
              sarif = json.load(f)

          findings = []

          for run in sarif.get("runs", []):

              tool = (
                  run.get("tool", {})
                  .get("driver", {})
                  .get("name", "2MS")
              )

              rules = {}

              for rule in (
                  run.get("tool", {})
                  .get("driver", {})
                  .get("rules", [])
              ):
                  rules[rule.get("id", "")] = rule

              for result in run.get("results", []):

                  rule_id = result.get("ruleId", "Unknown")

                  rule = rules.get(rule_id, {})

                  message = (
                      result.get("message", {})
                      .get("text", "No description available")
                  )

                  level = result.get(
                      "level",
                      "warning"
                  )

                  locations = result.get(
                      "locations",
                      []
                  )

                  if locations:

                      for location in locations:

                          physical = location.get(
                              "physicalLocation",
                              {}
                          )

                          artifact = physical.get(
                              "artifactLocation",
                              {}
                          )

                          region = physical.get(
                              "region",
                              {}
                          )

                          findings.append({
                              "rule": rule_id,
                              "name": rule.get(
                                  "name",
                                  rule_id
                              ),
                              "severity": level,
                              "message": message,
                              "file": artifact.get(
                                  "uri",
                                  "Unknown"
                              ),
                              "line": region.get(
                                  "startLine",
                                  "N/A"
                              )
                          })

                  else:

                      findings.append({
                          "rule": rule_id,
                          "name": rule.get(
                              "name",
                              rule_id
                          ),
                          "severity": level,
                          "message": message,
                          "file": "Unknown",
                          "line": "N/A"
                      })

          print(
              "Total 2MS findings:",
              len(findings)
          )

          styles = getSampleStyleSheet()

          title_style = styles["Title"]
          title_style.alignment = TA_CENTER

          heading_style = styles["Heading2"]

          normal = styles["BodyText"]

          doc = SimpleDocTemplate(
              pdf_file,
              pagesize=A4,
              rightMargin=40,
              leftMargin=40,
              topMargin=40,
              bottomMargin=40
          )

          story = []

          story.append(
              Paragraph(
                  "2MS Secret Scan Report",
                  title_style
              )
          )

          story.append(Spacer(1, 20))

          summary = [
              ["Repository", "${{ github.repository }}"],
              ["Branch", "${{ github.ref_name }}"],
              ["Commit", "${{ github.sha }}"],
              ["Total Findings", str(len(findings))]
          ]

          table = Table(
              summary,
              colWidths=[130, 350]
          )

          table.setStyle(
              TableStyle([
                  ("GRID", (0,0), (-1,-1), 0.5, colors.grey),
                  ("BACKGROUND", (0,0), (0,-1), colors.lightgrey),
                  ("FONTNAME", (0,0), (0,-1), "Helvetica-Bold"),
                  ("VALIGN", (0,0), (-1,-1), "TOP"),
                  ("PADDING", (0,0), (-1,-1), 8),
              ])
          )

          story.append(table)

          story.append(Spacer(1, 25))

          story.append(
              Paragraph(
                  "Security Findings",
                  heading_style
              )
          )

          story.append(Spacer(1, 10))

          if not findings:

              story.append(
                  Paragraph(
                      "No secrets were detected by 2MS.",
                      normal
                  )
              )

          else:

              for index, finding in enumerate(
                  findings,
                  start=1
              ):

                  story.append(
                      Paragraph(
                          f"Finding {index}: "
                          f"{finding['name']}",
                          heading_style
                      )
                  )

                  details = [
                      ["Rule", finding["rule"]],
                      ["Severity", finding["severity"]],
                      ["File", finding["file"]],
                      ["Line", str(finding["line"])],
                      ["Description", finding["message"]]
                  ]

                  finding_table = Table(
                      details,
                      colWidths=[100, 380]
                  )

                  finding_table.setStyle(
                      TableStyle([
                          ("GRID", (0,0), (-1,-1), 0.5, colors.grey),
                          ("BACKGROUND", (0,0), (0,-1), colors.lightgrey),
                          ("FONTNAME", (0,0), (0,-1), "Helvetica-Bold"),
                          ("VALIGN", (0,0), (-1,-1), "TOP"),
                          ("PADDING", (0,0), (-1,-1), 8),
                      ])
                  )

                  story.append(finding_table)

                  story.append(
                      Spacer(1, 20)
                  )

          doc.build(story)

          if os.path.exists(pdf_file):

              print(
                  "SUCCESS: PDF generated:"
              )

              print(pdf_file)

              print(
                  "PDF size:",
                  os.path.getsize(pdf_file),
                  "bytes"
              )

          else:

              print(
                  "ERROR: PDF was not generated."
              )

              raise SystemExit(1)

          PY

      - name: List final artifacts
        if: always()
        run: |
          echo "======================================"
          echo "FINAL ARTIFACTS"
          echo "======================================"

          ls -lah artifacts/

          echo ""
          echo "PDF:"
          ls -lh artifacts/*.pdf

      - name: Upload 2MS PDF Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2ms-security-report
          path: artifacts/2ms-security-report.pdf
          retention-days: 30
