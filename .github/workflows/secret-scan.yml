# 2MS Secret Scan — Readable PDF

name: Secret Scan (2MS)

on: [push]

permissions:
  contents: read
  security-events: write

jobs:

  scan:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create artifacts directory
        run: |
          mkdir -p artifacts

      - name: Run 2MS
        run: |
          docker run --rm \
            -v "$PWD":/repo \
            checkmarx/2ms \
            git /repo \
            --stdout-format sarif \
            --report-path /repo/artifacts/2ms.sarif \
            --ignore-on-exit results

      - name: Inspect 2MS SARIF
        if: always()
        run: |

          echo "========================================"
          echo "2MS SARIF FILE"
          echo "========================================"

          ls -lh artifacts/

          echo ""
          echo "========================================"
          echo "SARIF CONTENT"
          echo "========================================"

          cat artifacts/2ms.sarif

      - name: Upload SARIF to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: artifacts/2ms.sarif

      - name: Install ReportLab
        run: |
          python3 -m pip install reportlab

      - name: Generate readable PDF
        if: always()
        run: |

          python3 <<'PY'

          import json
          import os

          from reportlab.lib import colors
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.styles import getSampleStyleSheet
          from reportlab.lib.units import mm
          from reportlab.platypus import (
              SimpleDocTemplate,
              Paragraph,
              Spacer,
              Table,
              TableStyle
          )

          SARIF = "artifacts/2ms.sarif"
          PDF = "artifacts/2ms-security-report.pdf"

          # ----------------------------------------
          # Read SARIF
          # ----------------------------------------

          with open(SARIF, "r", encoding="utf-8") as f:
              sarif = json.load(f)

          findings = []

          for run in sarif.get("runs", []):

              tool = run.get("tool", {})
              driver = tool.get("driver", {})

              rules = {}

              for rule in driver.get("rules", []):

                  rule_id = rule.get("id")

                  if rule_id:
                      rules[rule_id] = rule

              results = run.get("results", [])

              print(
                  "Results found in SARIF:",
                  len(results)
              )

              for result in results:

                  rule_id = result.get(
                      "ruleId",
                      "Unknown"
                  )

                  rule = rules.get(
                      rule_id,
                      {}
                  )

                  message = (
                      result
                      .get("message", {})
                      .get(
                          "text",
                          "No description available"
                      )
                  )

                  level = result.get(
                      "level",
                      "warning"
                  )

                  locations = result.get(
                      "locations",
                      []
                  )

                  if locations:

                      for location in locations:

                          physical = location.get(
                              "physicalLocation",
                              {}
                          )

                          artifact = physical.get(
                              "artifactLocation",
                              {}
                          )

                          region = physical.get(
                              "region",
                              {}
                          )

                          file_path = artifact.get(
                              "uri",
                              "Unknown"
                          )

                          line = region.get(
                              "startLine",
                              "N/A"
                          )

                          findings.append({
                              "rule": rule_id,
                              "name": rule.get(
                                  "name",
                                  rule_id
                              ),
                              "severity": level,
                              "file": file_path,
                              "line": line,
                              "message": message
                          })

                  else:

                      findings.append({
                          "rule": rule_id,
                          "name": rule.get(
                              "name",
                              rule_id
                          ),
                          "severity": level,
                          "file": "Unknown",
                          "line": "N/A",
                          "message": message
                      })

          # ----------------------------------------
          # Print findings for debugging
          # ----------------------------------------

          print("")
          print("========================================")
          print("2MS FINDINGS")
          print("========================================")

          print(
              "Total findings:",
              len(findings)
          )

          for i, finding in enumerate(
              findings,
              1
          ):

              print("")
              print(
                  "Finding",
                  i
              )

              print(
                  "Rule:",
                  finding["rule"]
              )

              print(
                  "Severity:",
                  finding["severity"]
              )

              print(
                  "File:",
                  finding["file"]
              )

              print(
                  "Line:",
                  finding["line"]
              )

              print(
                  "Message:",
                  finding["message"]
              )

          # ----------------------------------------
          # Create PDF
          # ----------------------------------------

          styles = getSampleStyleSheet()

          title_style = styles["Title"]

          heading_style = styles["Heading2"]

          body_style = styles["BodyText"]

          doc = SimpleDocTemplate(
              PDF,
              pagesize=A4,
              rightMargin=18 * mm,
              leftMargin=18 * mm,
              topMargin=18 * mm,
              bottomMargin=18 * mm
          )

          story = []

          story.append(
              Paragraph(
                  "2MS Secret Scan Report",
                  title_style
              )
          )

          story.append(
              Spacer(
                  1,
                  15
              )
          )

          # ----------------------------------------
          # Summary
          # ----------------------------------------

          summary = [
              [
                  "Repository",
                  "${{ github.repository }}"
              ],

              [
                  "Branch",
                  "${{ github.ref_name }}"
              ],

              [
                  "Commit",
                  "${{ github.sha }}"
              ],

              [
                  "Total Findings",
                  str(len(findings))
              ]
          ]

          summary_table = Table(
              summary,
              colWidths=[
                  45 * mm,
                  125 * mm
              ]
          )

          summary_table.setStyle(
              TableStyle([
                  (
                      "GRID",
                      (0, 0),
                      (-1, -1),
                      0.5,
                      colors.grey
                  ),

                  (
                      "BACKGROUND",
                      (0, 0),
                      (0, -1),
                      colors.lightgrey
                  ),

                  (
                      "FONTNAME",
                      (0, 0),
                      (0, -1),
                      "Helvetica-Bold"
                  ),

                  (
                      "VALIGN",
                      (0, 0),
                      (-1, -1),
                      "TOP"
                  ),

                  (
                      "PADDING",
                      (0, 0),
                      (-1, -1),
                      7
                  )
              ])
          )

          story.append(
              summary_table
          )

          story.append(
              Spacer(
                  1,
                  20
              )
          )

          # ----------------------------------------
          # Findings
          # ----------------------------------------

          story.append(
              Paragraph(
                  "Security Findings",
                  heading_style
              )
          )

          story.append(
              Spacer(
                  1,
                  10
              )
          )

          if len(findings) == 0:

              story.append(
                  Paragraph(
                      "No secret findings were returned by 2MS.",
                      body_style
                  )
              )

          else:

              for number, finding in enumerate(
                  findings,
                  1
              ):

                  story.append(
                      Paragraph(
                          "Finding "
                          + str(number)
                          + ": "
                          + str(
                              finding["name"]
                          ),
                          heading_style
                      )
                  )

                  details = [

                      [
                          "Rule",
                          str(
                              finding["rule"]
                          )
                      ],

                      [
                          "Severity",
                          str(
                              finding["severity"]
                          )
                      ],

                      [
                          "File",
                          str(
                              finding["file"]
                          )
                      ],

                      [
                          "Line",
                          str(
                              finding["line"]
                          )
                      ],

                      [
                          "Description",
                          str(
                              finding["message"]
                          )
                      ]
                  ]

                  finding_table = Table(
                      details,
                      colWidths=[
                          40 * mm,
                          130 * mm
                      ]
                  )

                  finding_table.setStyle(
                      TableStyle([

                          (
                              "GRID",
                              (0, 0),
                              (-1, -1),
                              0.5,
                              colors.grey
                          ),

                          (
                              "BACKGROUND",
                              (0, 0),
                              (0, -1),
                              colors.lightgrey
                          ),

                          (
                              "FONTNAME",
                              (0, 0),
                              (0, -1),
                              "Helvetica-Bold"
                          ),

                          (
                              "VALIGN",
                              (0, 0),
                              (-1, -1),
                              "TOP"
                          ),

                          (
                              "PADDING",
                              (0, 0),
                              (-1, -1),
                              7
                          )
                      ])
                  )

                  story.append(
                      finding_table
                  )

                  story.append(
                      Spacer(
                          1,
                          15
                      )
                  )

          doc.build(story)

          print("")
          print(
              "PDF generated:",
              PDF
          )

          print(
              "PDF size:",
              os.path.getsize(PDF),
              "bytes"
          )

          PY

      - name: Verify PDF
        if: always()
        run: |

          echo "========================================"
          echo "FINAL ARTIFACTS"
          echo "========================================"

          find artifacts -type f -exec ls -lh {} \;

          if [ ! -f artifacts/2ms-security-report.pdf ]; then
              echo "ERROR: PDF was not generated."
              exit 1
          fi

          echo ""
          echo "SUCCESS: PDF exists."

      - name: Upload 2MS PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2ms-security-report
          path: artifacts/2ms-security-report.pdf
          if-no-files-found: error
          retention-days: 30