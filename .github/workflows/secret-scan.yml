name: Secret Scan (2MS)

on: [pull_request]

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run 2MS - Readable Report
        run: |
          mkdir -p artifacts

          docker run --rm \
            -v "$PWD":/repo \
            checkmarx/2ms \
            git /repo \
            --stdout-format yaml \
            --ignore-on-exit results \
            > artifacts/2ms-report.yaml

      - name: Verify 2MS report
        if: always()
        run: |
          echo "===== ARTIFACTS ====="
          ls -lah artifacts/

          echo "===== 2MS REPORT ====="
          cat artifacts/2ms-report.yaml

      - name: Upload 2MS readable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2ms-readable-report
          path: artifacts/2ms-report.yaml
          if-no-files-found: error