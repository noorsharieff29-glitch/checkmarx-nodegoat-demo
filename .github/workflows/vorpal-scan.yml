
name: Vorpal Code Scan

on: [push,pull_request]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:

  vorpal:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v46.0.1
        with:
          separator: ','

      - name: Create reports directory
        run: |
          mkdir -p reports

      - name: Run Vorpal
        if: ${{ steps.changed-files.outputs.all_changed_files != '' }}
        uses: checkmarx/vorpal-reviewdog-github-action@v1.0.0
        with:
          source_path: "${{ steps.changed-files.outputs.all_changed_files }}"
          filter_mode: file
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-check
          level: info
          fail_on_error: false
          reviewdog_flags: "-tee"

      - name: Create readable Vorpal report
        if: always()
        run: |

          cat > reports/vorpal-report.txt <<EOF
          ============================================================
                         VORPAL SECURITY SCAN REPORT
          ============================================================

          Repository : ${{ github.repository }}
          Branch     : ${{ github.ref_name }}
          Commit     : ${{ github.sha }}
          Run ID     : ${{ github.run_id }}

          ============================================================
                         SCAN INFORMATION
          ============================================================

          Tool       : Checkmarx Vorpal
          Reporter   : Reviewdog
          Trigger    : ${{ github.event_name }}

          ============================================================
                         VORPAL FINDINGS
          ============================================================

          The detailed Vorpal findings are displayed in the
          GitHub Actions log and GitHub Check created by Reviewdog.

          ============================================================
          EOF

          echo ""
          echo "============================================================"
          echo "Vorpal report created"
          echo "============================================================"

          cat reports/vorpal-report.txt

      - name: Save Actions log information
        if: always()
        run: |

          echo ""
          echo "============================================================"
          echo "VORPAL / REVIEWDOG OUTPUT"
          echo "============================================================"

          echo "The Vorpal action output above contains the actual findings."

      - name: Upload Vorpal readable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vorpal-security-report
          path: reports/vorpal-report.txt
          if-no-files-found: error
          retention-days: 30