
name: Vorpal Code Scan

on: [push,pull_request]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:

  vorpal:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v46.0.1
        with:
          separator: ','

      - name: Show files being scanned
        if: always()
        run: |
          echo "=========================================="
          echo "FILES BEING SCANNED BY VORPAL"
          echo "=========================================="

          echo "${{ steps.changed-files.outputs.all_changed_files }}"

      - name: Run Vorpal
        if: ${{ steps.changed-files.outputs.all_changed_files != '' }}
        uses: checkmarx/vorpal-reviewdog-github-action@v1.0.0
        with:
          source_path: "${{ steps.changed-files.outputs.all_changed_files }}"
          filter_mode: nofilter
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-check
          level: info
          fail_on_error: false

      - name: Create scan information
        if: always()
        run: |

          mkdir -p reports

          cat > reports/vorpal-summary.txt <<EOF
          ============================================================
                         VORPAL SECURITY SCAN
          ============================================================

          Repository : ${{ github.repository }}
          Branch     : ${{ github.ref_name }}
          Commit     : ${{ github.sha }}
          Event      : ${{ github.event_name }}
          Run ID     : ${{ github.run_id }}

          ============================================================
                         FILES SCANNED
          ============================================================

          ${{ steps.changed-files.outputs.all_changed_files }}

          ============================================================
                         RESULT
          ============================================================

          The complete Vorpal/Reviewdog output is available in the
          GitHub Actions workflow log.

          The GitHub Check created by Reviewdog contains the
          security findings.

          ============================================================
          EOF

      - name: Upload Vorpal summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vorpal-security-report
          path: reports/vorpal-summary.txt
          if-no-files-found: error
          retention-days: 30