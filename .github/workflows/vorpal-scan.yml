name: Vorpal Code Scan

on: [push, pull_request]

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  vorpal:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Vorpal
        uses: checkmarx/vorpal-reviewdog-github-action@v1.0.0
        with:
          source_path: "."
          filter_mode: nofilter
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-check
          level: info
          fail_on_error: false

      - name: Wait for Check
        run: sleep 10

      - name: Get Vorpal Check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          mkdir -p reports

          gh api \
            "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" \
            --jq '.check_runs[] |
            select(.name | test("Vorpal|reviewdog"; "i")) |
            {
              name: .name,
              status: .status,
              conclusion: .conclusion,
              title: .output.title,
              summary: .output.summary,
              text: .output.text
            }' \
            > reports/vorpal-report.txt

          echo "=============================="
          echo "VORPAL REPORT"
          echo "=============================="

          cat reports/vorpal-report.txt

      - name: Upload Vorpal Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vorpal-report
          path: reports/vorpal-report.txt
          if-no-files-found: error
          retention-days: 30