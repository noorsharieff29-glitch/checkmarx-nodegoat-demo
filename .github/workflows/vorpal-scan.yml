
name: Vorpal Code Scan

on: [push,pull_request]
  
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:

  vorpal:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "=========================================="
          echo "FILES IN REPOSITORY"
          echo "=========================================="

          find . -type f \
            ! -path './.git/*' \
            | head -200

      - name: Create reports directory
        run: |
          mkdir -p reports

      - name: Run Vorpal
        uses: checkmarx/vorpal-reviewdog-github-action@v1.0.0
        with:
          source_path: "."
          filter_mode: nofilter
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-check
          level: info
          fail_on_error: false

      - name: Create scan report
        if: always()
        run: |

          cat > reports/vorpal-report.txt <<EOF
Repository : ${{ github.repository }}
Branch     : ${{ github.ref_name }}
Commit     : ${{ github.sha }}
Event      : ${{ github.event_name }}
Run ID     : ${{ github.run_id }}

============================================================
                 SCAN CONFIGURATION
============================================================

Scanner       : Checkmarx Vorpal
Source        : Entire repository
Filter Mode   : nofilter
Severity      : info

============================================================
                 IMPORTANT
============================================================

Vorpal findings are reported by Reviewdog to the
GitHub Check associated with this workflow.

Open:

GitHub
  -> Actions
  -> Vorpal Code Scan
  -> This workflow run
  -> Checks
  -> Vorpal

============================================================
EOF

          echo "Report created."

      - name: Upload Vorpal report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vorpal-security-report
          path: reports/vorpal-report.txt
          if-no-files-found: error
          retention-days: 30