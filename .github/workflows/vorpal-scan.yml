name: Vorpal Code Scan
on: [push]
jobs:
  vorpal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v46.0.1
        with:
          separator: ','
      - name: Vorpal with reviewdog
        if: ${{ steps.changed-files.outputs.all_changed_files != '' }}
        uses: checkmarx/vorpal-reviewdog-github-action@v1.0.0
        with:
          source_path: "${{ steps.changed-files.outputs.all_changed_files }}"
          filter_mode: file
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-check
          level: error
          fail_on_error: true
      - name: Create report directory
        if: always()
        run: |
          mkdir -p reports

      - name: Create scan summary
        if: always()
        run: |
          cat > reports/vorpal-report.html <<EOF
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>Vorpal Code Scan Report</title>
            <style>
              body {
                font-family: Arial, sans-serif;
                margin: 40px;
              }

              h1 {
                color: #222;
              }

              .section {
                margin-top: 25px;
                padding: 15px;
                border: 1px solid #ccc;
              }

              table {
                width: 100%;
                border-collapse: collapse;
              }

              th, td {
                border: 1px solid #ccc;
                padding: 8px;
                text-align: left;
              }

              th {
                background: #f2f2f2;
              }
            </style>
          </head>

          <body>

            <h1>Vorpal Code Scan Report</h1>

            <div class="section">
              <h2>Scan Information</h2>

              <table>
                <tr>
                  <th>Repository</th>
                  <td>${{ github.repository }}</td>
                </tr>

                <tr>
                  <th>Branch</th>
                  <td>${{ github.ref_name }}</td>
                </tr>

                <tr>
                  <th>Commit</th>
                  <td>${{ github.sha }}</td>
                </tr>

                <tr>
                  <th>Workflow Run</th>
                  <td>${{ github.run_id }}</td>
                </tr>
              </table>
            </div>

            <div class="section">
              <h2>Vorpal Scan</h2>

              <p>
                Vorpal security analysis was executed against the changed
                source files.
              </p>

              <p>
                The detailed findings are available in the GitHub Check
                generated by Reviewdog.
              </p>
            </div>

          </body>
          </html>
          EOF

      - name: Install PDF converter
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf

      - name: Convert report to PDF
        if: always()
        run: |
          wkhtmltopdf \
            reports/vorpal-report.html \
            reports/vorpal-code-scan-report.pdf

      - name: Upload Vorpal PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vorpal-code-scan-report
          path: reports/vorpal-code-scan-report.pdf
          retention-days: 30
```
