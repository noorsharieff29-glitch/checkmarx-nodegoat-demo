
name: Vorpal Code Scan

on: [push, pull_request]

jobs:
  vorpal:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Vorpal
        uses: checkmarx/vorpal-reviewdog-github-action@v1.0.0
        with:
          source_path: "."
          filter_mode: nofilter
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-check
          level: info
          fail_on_error: false

      - name: Create readable report
        if: always()
        run: |
          mkdir -p reports

          echo "========================================" > reports/vorpal-report.txt
          echo "       VORPAL SECURITY SCAN REPORT" >> reports/vorpal-report.txt
          echo "========================================" >> reports/vorpal-report.txt
          echo "" >> reports/vorpal-report.txt

          echo "Repository: ${{ github.repository }}" >> reports/vorpal-report.txt
          echo "Branch: ${{ github.ref_name }}" >> reports/vorpal-report.txt
          echo "Commit: ${{ github.sha }}" >> reports/vorpal-report.txt
          echo "" >> reports/vorpal-report.txt

          echo "========================================" >> reports/vorpal-report.txt
          echo "       VORPAL SCAN RESULT" >> reports/vorpal-report.txt
          echo "========================================" >> reports/vorpal-report.txt
          echo "" >> reports/vorpal-report.txt

          echo "Vorpal scan completed." >> reports/vorpal-report.txt
          echo "" >> reports/vorpal-report.txt
          echo "Detailed findings are available in:" >> reports/vorpal-report.txt
          echo "GitHub -> Checks -> Vorpal" >> reports/vorpal-report.txt

          cat reports/vorpal-report.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vorpal-report
          path: reports/vorpal-report.txt
