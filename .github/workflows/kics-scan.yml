name: KICS IaC Scan

on:
  pull_request:

jobs:
  kics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run KICS
        uses: checkmarx/kics-github-action@v2.1.20
        with:
          path: '.'
          output_formats: 'json'
          output_path: kics-results/
          ignore_on_exit: results

      - name: Show KICS results
        if: always()
        run: |
          echo "KICS results:"
          ls -lah kics-results/