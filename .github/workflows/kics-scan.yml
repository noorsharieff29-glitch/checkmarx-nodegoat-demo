name: KICS IaC Scan

on: [pull_request]

jobs:
  kics-job:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run KICS Scan
        uses: checkmarx/kics-github-action@v2.1.20
        with:
          path: '.'
          output_path: kics-results/
          output_formats: 'json,sarif,pdf'
         

      - name: Show results
        run: |
          echo "KICS reports generated:"
          ls -lah kics-results/
          cat kics-results/results.json

      - name: Upload KICS PDF Report
        uses: actions/upload-artifact@v4
        with:
          name: kics-pdf-report
          path: kics-results/results.pdf