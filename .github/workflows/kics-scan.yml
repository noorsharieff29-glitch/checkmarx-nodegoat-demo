name: KICS IaC Scan

on: [pull_request]

jobs:
  kics-job:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run KICS Scan
        uses: checkmarx/kics-github-action@v2.1.20
        with:
          path: '.'
          output_path: kics-results/
          output_formats: 'json,sarif,html'

      - name: Show results
        run: cat kics-results/results.json

      - name: Convert KICS HTML report to PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf
          wkhtmltopdf kics-results/results.html kics-results/kics-report.pdf

      - name: Upload KICS PDF Report
        uses: actions/upload-artifact@v4
        with:
          name: kics-pdf-report
          path: kics-results/kics-report.pdf